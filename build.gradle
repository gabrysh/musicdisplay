plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url 'https://repo.hypixel.net/repository/Hypixel'
	}
	maven {
		name "FDD Maven"
		url "https://maven.firstdark.dev/releases"
	}

	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://repo.viaversion.com/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"halo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}
def lwjglVersion = "3.4.1"
configurations {
	shadow
	implementation.extendsFrom shadow
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-windows"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-windows"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos-arm64"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos-arm64"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-linux"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-linux"
	shadow "com.github.LabyStudio:java-spotify-api:+"
	include "com.github.LabyStudio:java-spotify-api:+"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}