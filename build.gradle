buildscript {
	repositories {
		maven { url 'https://maven.fabricmc.net/' }
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		// Legacy (obfuscated 1.21.x) Loom applied via buildscript classpath — the plugins{} DSL
		// marker for old Loom versions is not resolvable from maven.fabricmc.net.
		classpath 'net.fabricmc:fabric-loom:1.11.8'
	}
}

plugins {
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url 'https://repo.hypixel.net/repository/Hypixel'
	}

	maven {
		name "FDD Maven"
		url "https://maven.firstdark.dev/releases"
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://repo.viaversion.com/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"halo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

def lwjglVersion = "3.4.1"
configurations {
	shadow
	implementation.extendsFrom shadow
}

dependencies {
	minecraft "com.mojang:minecraft:1.21.10"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:0.17.2"
	implementation "org.jspecify:jspecify:1.0.0"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10"

	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-windows"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-windows"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos-arm64"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos-arm64"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-linux"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-linux"
	shadow "com.github.LabyStudio:java-spotify-api:+"
	include "com.github.LabyStudio:java-spotify-api:+"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
