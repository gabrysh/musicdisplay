plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.maven_group

// --- Multi-version (Stonecutter) dependency matrix ---
def mcVersions = [
		"26.1.2" : [ minecraft: "26.1.2",  loader: "0.19.3", fapi: "0.154.2+26.1.2",  javaVersion: 25, mojmap: false ],
		"1.21.11": [ minecraft: "1.21.11", loader: "0.19.3", fapi: "0.141.4+1.21.11", javaVersion: 21, mojmap: true  ],
		"1.21.10": [ minecraft: "1.21.10", loader: "0.19.3", fapi: "0.138.4+1.21.10", javaVersion: 21, mojmap: true  ],
]
def active = mcVersions[stonecutter.current.version]
if (active == null) {
	throw new GradleException("No dependency matrix entry for Stonecutter version '${stonecutter.current.version}'")
}

repositories {
	maven {
		url 'https://repo.hypixel.net/repository/Hypixel'
	}
	maven {
		name "FDD Maven"
		url "https://maven.firstdark.dev/releases"
	}

	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://repo.viaversion.com/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"halo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}
def lwjglVersion = "3.4.1"
configurations {
	shadow
	implementation.extendsFrom shadow
}

dependencies {
	minecraft "com.mojang:minecraft:${active.minecraft}"
	// 26.1+ is unobfuscated (no mappings needed); older versions use official Mojang mappings.
	// NOTE: building the obfuscated 1.21.x nodes requires Loom 1.14 (per-node loom version, TODO);
	// Loom 1.15 rejects Mojang mappings there. Guarded so the 26.1.2 node still configures/builds.
	if (active.mojmap) {
		try {
			mappings loom.officialMojangMappings()
		} catch (Exception e) {
			logger.warn("[multiversion] Mojang mappings unavailable for ${active.minecraft} with this Loom (needs Loom 1.14): ${e.message}")
		}
	}
	implementation "net.fabricmc:fabric-loader:${active.loader}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${active.fapi}"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-windows"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-windows"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos-arm64"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-macos-arm64"
	shadow "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-linux"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-linux"
	shadow "com.github.LabyStudio:java-spotify-api:+"
	include "com.github.LabyStudio:java-spotify-api:+"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = active.javaVersion
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(active.javaVersion)
	targetCompatibility = JavaVersion.toVersion(active.javaVersion)
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}